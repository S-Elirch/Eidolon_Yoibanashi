# Fork CI: checks and builds only; publication is configured separately before release.
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [my-features]
    tags: ["v*"]

# 同一个PR的新提交取消旧运行；分支推送保留各次检查。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # 平时 2 分钟左右；测试挂住时不等到 GitHub 默认的 6 小时
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # 这个 action 不发布 v10 这样的大版本标签
        with:
          working-directory: backend
          enable-cache: true
      # --locked：uv.lock 和 pyproject.toml 对不上时失败
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pyright
      # 每个 CPU 一个进程并行跑（pytest-xdist）；单个测试 2 分钟还没结束时打印所有线程的栈，挂住时能看出卡在哪里
      - run: uv run pytest -n auto -o faulthandler_timeout=120

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # shadcn 纪律里能机器检查的几条：cn 的导入、任意值里的颜色、important 类、不再引用 Astryx（frontend/AGENTS.md）
      - run: sh scripts/check-discipline.sh
      # next build 由下面的镜像构建跑

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck deploy/*.sh scripts/*.sh frontend/scripts/*.sh
      # wayfinder 地图的票：已解决的有结论、Blocked by 的票号存在、地图链接到它（docs/agents/issue-tracker.md）
      - run: sh scripts/check-scratch.sh

  # 和检查同时跑，只构建、不推送，层写进 GitHub Actions 的缓存
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  visit-outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build isolated visit test image
        run: docker build -f validation/native/Dockerfile -t visit-outreach-test .
      - name: Test with fake providers and temporary databases
        run: |
          docker run --rm --network none --entrypoint sh \
            -v "$PWD/characters:/characters:ro" visit-outreach-test \
            -c 'PYTHONPATH=/app/src:/app /app/.venv/bin/python -m unittest discover -s /app/validation/native -p "test_*.py" -q'
